<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ZIEZO STREAM — sem conexão</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at 50% 15%, #153a2a 0, #08100b 38%, #030504 100%); color: #f4fff8; }
      main { width: min(92vw, 520px); padding: 40px; border: 1px solid rgba(76, 255, 149, .22); border-radius: 28px; background: rgba(7, 17, 11, .86); box-shadow: 0 28px 90px rgba(0, 0, 0, .45); text-align: center; }
      .mark { width: 72px; height: 72px; margin: 0 auto 24px; display: grid; place-items: center; border-radius: 22px; background: #28e878; color: #041008; font-size: 42px; font-weight: 900; }
      h1 { margin: 0 0 12px; font-size: 28px; }
      p { margin: 0 0 28px; color: #b9cbbf; line-height: 1.6; }
      button { border: 0; border-radius: 999px; padding: 14px 24px; background: #28e878; color: #041008; font: inherit; font-weight: 800; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">Z</div>
      <h1>Sem conexão com a internet</h1>
      <p>Conecte o computador à internet e tente novamente para abrir o ZIEZO STREAM.</p>
      <button type="button" onclick="location.href='https://ziezobr.github.io/ziezo-stream-web/'">Tentar novamente</button>
    </main>
  </body>
</html>
