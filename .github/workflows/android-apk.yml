name: Validar APK Android
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'
      - run: chmod +x gradlew && ./gradlew --no-daemon assembleRelease lintRelease
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: android-unsigned-and-lint
          path: |
            android/app/build/outputs/apk/release/app-release-unsigned.apk
            android/app/build/reports/lint-results-release.html

