name: Instalador Windows 2.0
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['desktop/**', '.github/workflows/windows-installer.yml']
permissions:
  contents: write
concurrency:
  group: installer-2
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
        working-directory: desktop
      - run: npm run dist -- --publish never
        working-directory: desktop
      - name: Publicar versão 2.0
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = 'desktop/release/ZIEZO-STREAM-Setup-2.0.0.exe'
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer).Hash.ToLower()
          "$hash  ZIEZO-STREAM-Setup-2.0.0.exe" | Set-Content -Encoding utf8 desktop/release/SHA256SUMS.txt
          gh release view v2.0.0 --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload v2.0.0 $installer desktop/release/SHA256SUMS.txt --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create v2.0.0 $installer desktop/release/SHA256SUMS.txt --target $env:GITHUB_SHA --title 'ZIEZO STREAM 2.0 — Windows' --notes-file desktop/release-notes.md --latest --repo $env:GITHUB_REPOSITORY
          }
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao publicar o instalador.' }
