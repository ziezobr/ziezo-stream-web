name: Instalador Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['desktop/**', '.github/workflows/windows-installer.yml']
permissions:
  contents: write
concurrency:
  group: installer-2
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
        working-directory: desktop
      - run: npm run dist -- --publish never
        working-directory: desktop
      - name: Publicar versão Windows
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content desktop/package.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          $name = "ZIEZO-STREAM-Setup-$version.exe"
          $installer = "desktop/release/$name"
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer).Hash.ToLower()
          "$hash  $name" | Set-Content -Encoding utf8 desktop/release/SHA256SUMS.txt
          $files = @($installer, 'desktop/release/SHA256SUMS.txt', 'desktop/release/latest.yml', "$installer.blockmap")
          foreach ($file in $files) { if (!(Test-Path -LiteralPath $file)) { throw "Arquivo obrigatório ausente: $file" } }
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @files --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag @files --target $env:GITHUB_SHA --title "ZIEZO STREAM $version — Windows" --notes-file desktop/release-notes.md --latest --repo $env:GITHUB_REPOSITORY
          }
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao publicar o instalador.' }
