name: Publicar Ziezo Stream
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test tests/ad-policy.test.mjs
      - run: node scripts/fetch-open-films.mjs
      - run: npm run build
        env:
          GITHUB_PAGES_BASE: /ziezo-stream-web/
          VITE_SUPABASE_URL: https://jxmkyzpscscajnnkerhd.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_WOSBOFaeQdYlQ09_ip_bfw_00nnHY9N
          VITE_GOOGLE_LOGIN: ${{ vars.GOOGLE_LOGIN_ENABLED }}
          VITE_ADSENSE_APPROVED: ${{ vars.ADSENSE_APPROVED }}
          VITE_ADSENSE_CONSENT_READY: ${{ vars.ADSENSE_CONSENT_READY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
